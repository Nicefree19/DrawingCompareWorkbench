[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-compare-workbench"
version = "0.1.0"
description = "Standalone CAD drawing comparison workbench and CLI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Drawing Compare Workbench Team"},
]
keywords = ["cad", "dxf", "dwg", "drawing-comparison", "engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "ezdxf[draw]>=1.1.0,<2.0.0",
    "jsonschema>=4.21.0,<5.0.0",
    "numpy>=1.24.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "opencv-python-headless>=4.8.0,<5.0.0",
    "packaging>=21.0",
    "pandas>=2.0.0,<3.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1",
    "rich>=12.5.0",
    "rtree>=1.0.0,<2.0.0",
    # Required runtime modules per scripts/release_environment_check.py; absent
    # they silently degrade matching (Hungarian->greedy) and disable SSIM.
    "scikit-image>=0.21.0,<1.0.0",
    "scipy>=1.10.0,<2.0.0",
]

[project.urls]
Homepage = "https://example.invalid/drawing-compare-workbench"
Documentation = "docs/"
Repository = "https://example.invalid/drawing-compare-workbench"
Issues = "https://example.invalid/drawing-compare-workbench/issues"

[project.scripts]
cad-compare = "src.cli.cad_compare:main"
drawing-compare-workbench = "start_drawing_compare_workbench:main"

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0,<7.0.0",
    "pyqtgraph>=0.13.3",
]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[tool.setuptools]
py-modules = ["start_drawing_compare_workbench"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Phase 1: 점진적 타입 강화 (새 코드에만 적용)
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
# 타입 에러 조기 발견
local_partial_types = true
# 새 파일 strict 모드 (점진적 적용)
# 핵심 모듈만 strict 적용

[[tool.mypy.overrides]]
module = [
    "src.core.parsers.unified_mgt_parser",
    "src.core.converters.unified_mgt_tekla_converter",
    "src.core.mappers.external_mapping_loader",
    "src.core.validators.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
]
disallow_untyped_defs = false
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = [
    "tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0703",  # broad-except
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "x", "y", "z"]

[tool.bandit]
exclude_dirs = ["tests", "test"]
skips = ["B101", "B601"]
