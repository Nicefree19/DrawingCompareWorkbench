name: CAD Format Regression

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cad-format-regression:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate repository hygiene and CAD policy
        run: |
          git diff --check
          python scripts\cad_policy_gate.py

      # Lint ONLY the Python files changed in this PR (black + isort). The repo
      # has a large pre-existing format backlog (160/112 files), so a full-repo
      # gate would be a red wall + would reformat the frozen GUI monolith; the
      # changed-files scope keeps new/touched code clean without that churn.
      # PR-only: a push to main has no base to diff against.
      - name: Lint changed Python files (black + isort, PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          $changed = git diff --name-only --diff-filter=d ${{ github.event.pull_request.base.sha }} HEAD -- "*.py"
          if (-not $changed) {
            Write-Host "No changed Python files to lint."
          } else {
            Write-Host "Linting changed Python files:"
            $changed | ForEach-Object { Write-Host "  $_" }
            python -m black --check --diff @($changed)
            if ($LASTEXITCODE -ne 0) { Write-Error "black: changed files need formatting (run 'black <files>')"; exit 1 }
            python -m isort --check-only --diff @($changed)
            if ($LASTEXITCODE -ne 0) { Write-Error "isort: changed files need import sorting (run 'isort <files>')"; exit 1 }
          }

      - name: Validate CAD sample manifest, golden results, and regression report
        run: |
          python scripts\cad_format_regression.py --check --report build\reports\cad-format-regression-report.md

      - name: Run CAD importer, normalizer, writer, and diff regression tests
        run: |
          python -m pytest `
            tests\unit\services\comparison\test_dxf_importer.py `
            tests\unit\services\comparison\test_dwg_importer.py `
            tests\unit\services\comparison\test_dxf_writer.py `
            tests\unit\services\comparison\test_drawing_normalizer.py `
            tests\unit\services\comparison\test_drawing_compare_engine.py `
            tests\unit\services\comparison\test_import_compare_pipeline.py `
            tests\unit\services\comparison\test_cad_stability_limits.py `
            tests\unit\services\comparison\test_dwg_native_reader.py `
            tests\unit\services\comparison\test_dwg_r2018_reader.py `
            tests\unit\services\comparison\test_dwg_native_ac1032_adapter.py `
            tests\unit\services\comparison\test_native_scene_pack_builder.py `
            tests\unit\services\comparison\test_cad_format_regression.py `
            tests\unit\services\comparison\test_drawing_batch.py `
            tests\unit\services\comparison\test_preflight.py `
            tests\unit\services\comparison\test_zone_vector_renderer.py `
            tests\unit\services\comparison\test_change_zones.py `
            tests\unit\services\comparison\test_canonical_text_recall.py `
            tests\unit\services\comparison\test_e2e_pipeline_smoke.py `
            tests\unit\scripts\test_release_environment_check.py `
            tests\unit\scripts\test_build_spec_bundling.py `
            tests\unit\scripts\test_lint_ci_enforced.py `
            -q -o log_cli=false

      # GUI fail-loud surfacing tests run offscreen and are kept in a SEPARATE
      # gating step (not continue-on-error) so a PySide6 native-AV crash is
      # clearly attributed here rather than conflated with the deterministic
      # headless bulk above. Deterministic locally (offscreen, 2x green).
      - name: Run GUI fail-loud surfacing tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest `
            tests\unit\gui\test_zone_tree_failure_surfacing.py `
            -q -o log_cli=false

      - name: Golden accuracy floor (no detection regression)
        run: |
          python scripts\measure_golden_accuracy_baseline.py `
            --out-json build\reports\golden-accuracy.json `
            --out-md build\reports\golden-accuracy.md `
            --max-noise-fp 0 --min-precision 0.50 --min-recall 0.68

      - name: Upload CAD regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-format-regression-report
          path: |
            build/reports/cad-format-regression-report.md
            build/reports/golden-accuracy.md
