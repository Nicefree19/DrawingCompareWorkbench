name: CAD Format Regression

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cad-format-regression:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate repository hygiene and CAD policy
        run: |
          git diff --check
          python scripts\cad_policy_gate.py

      - name: Validate CAD sample manifest, golden results, and regression report
        run: |
          python scripts\cad_format_regression.py --check --report build\reports\cad-format-regression-report.md

      - name: Run CAD importer, normalizer, writer, and diff regression tests
        run: |
          python -m pytest `
            tests\unit\services\comparison\test_dxf_importer.py `
            tests\unit\services\comparison\test_dwg_importer.py `
            tests\unit\services\comparison\test_dxf_writer.py `
            tests\unit\services\comparison\test_drawing_normalizer.py `
            tests\unit\services\comparison\test_drawing_compare_engine.py `
            tests\unit\services\comparison\test_import_compare_pipeline.py `
            tests\unit\services\comparison\test_cad_stability_limits.py `
            tests\unit\services\comparison\test_dwg_native_reader.py `
            tests\unit\services\comparison\test_dwg_r2018_reader.py `
            tests\unit\services\comparison\test_dwg_native_ac1032_adapter.py `
            tests\unit\services\comparison\test_native_scene_pack_builder.py `
            tests\unit\services\comparison\test_cad_format_regression.py `
            tests\unit\services\comparison\test_drawing_batch.py `
            tests\unit\services\comparison\test_preflight.py `
            tests\unit\services\comparison\test_zone_vector_renderer.py `
            -q -o log_cli=false

      - name: Upload CAD regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-format-regression-report
          path: build/reports/cad-format-regression-report.md
