# pytest 설정 파일
# Phase 2.3: 테스트 구조 통합 및 pytest 프레임워크 고도화
#
# NOTE:
# - pytest는 `pytest.ini`가 존재하면 `pyproject.toml`의 pytest 설정을 무시합니다.
# - `pytest.ini`는 반드시 `[pytest]` 섹션을 사용해야 합니다.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --capture=no

# 테스트 마커 정의 (Phase 2 CI/CD 통합)
markers =
    unit: Unit tests (fast, no I/O) - 단위 테스트 (빠른 실행)
    integration: Integration tests (moderate speed) - 통합 테스트 (중간 실행 속도)
    slow: Slow tests (skip by default with -m "not slow") - 시간이 오래 걸리는 테스트
    performance: Performance benchmarks (벤치마크)
    benchmark: Benchmark tests (pytest-benchmark)
    asyncio: Async tests (pytest-asyncio)
    ui: UI automation tests (Windows-MCP)
    gui: GUI automation tests (pytest-qt)
    regression: Regression tests (comprehensive) - 회귀 테스트
    error_handling: 오류 처리 테스트
    chunk_processing: 청크 처리 테스트
    mcp: MCP 아키텍처 테스트
    parser: 파싱 모듈 테스트
    tekla: Tekla 연동 테스트
    smoke: 스모크 테스트 (기본 동작 확인)
    requires_tekla: Tekla API 환경 필요 (CI 스킵)
    requires_large_data: 대형 데이터 파일 필요 (CI 스킵)
    requires_external_service: 외부 서비스 연동 필요 (CI 스킵)
    subprocess_real: Opt out of unit conftest autouse stub for export_viewer_package_isolated; runs the real subprocess (audit §1.3 finding #4)
    audit_chain_integration: Plan §16 Phase C-4.1 end-to-end audit chain proves CRITICAL closure

# 로그 설정
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 테스트 필터링 설정
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# 테스트 병렬 실행 설정 (pytest-xdist 사용 시)
# addopts = -n auto

# 테스트 디렉토리 설정
norecursedirs = .git .tox dist build *.egg venv .venv tekla_venv __pycache__ .pytest_cache legacy_broken

# 테스트 타임아웃 설정 (pytest-timeout 사용 시)
timeout = 300
timeout_method = thread
